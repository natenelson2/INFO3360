openapi: "3.0.3"
info:
  title: Hockey Event Ingestion API
  version: "1.0.0"
  description: >
    Contract for provider game-event create and coach evaluation-form create.
    Source of truth: docs/api/resource-design.md and
    docs/api/error-and-status-model.md.
    No auth or admin paths. Event paths and schemas stay as originally defined;
    evaluation paths were added without renaming the event half.
    Event fields: who / what / when, providerEventId, period.
    Evaluation fields: player, practiceContext, notes (player, practice
    context, judgment/notes from the resource design / inventory).

paths:
  /game-events:
    post:
      summary: Create one hockey game event (provider handoff)
      operationId: createHockeyEvent
      description: >
        Third-party hockey data provider pushes one game event.
        Success stores a new event and returns 201 with the created resource.
        Failures never return 200 with a success flag set to false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HockeyEvent"
      responses:
        "201":
          description: Event accepted and created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HockeyEventResponse"
        "400":
          description: Malformed request — body missing, not JSON, or otherwise unusable HTTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing identity — no valid credentials on the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — identity is valid but this caller may not create game events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict — providerEventId already stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed — JSON parsed but one or more fields failed rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /evaluation-forms:
    post:
      summary: Create one coach evaluation form (coach handoff)
      operationId: createEvaluationForm
      description: >
        Coach submits a player evaluation after practice.
        Success stores a new evaluation and returns 201 with the created resource.
        Failures never return 200 with a success flag set to false.
        Conflict (409) is not used for this operation per the status-code map.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluationForm"
      responses:
        "201":
          description: Evaluation accepted and created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationFormResponse"
        "400":
          description: Malformed request — body missing, not JSON, or otherwise unusable HTTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing identity — no valid credentials on the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — identity is valid but this caller may not create evaluation forms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed — JSON parsed but one or more fields failed rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HockeyEvent:
      type: object
      description: Request body for POST /game-events (provider handoff)
      required:
        - providerEventId
        - period
        - who
        - what
        - when
      properties:
        providerEventId:
          type: string
          description: >
            Provider's unique id for this event. Duplicate values collide with
            stored data and return 409 CONFLICT.
          minLength: 1
        period:
          type: string
          description: >
            Game period for the event. Must be present and valid
            (1, 2, 3, or OT per the status-model examples).
          minLength: 1
        who:
          type: string
          description: Who the event is about (inventory plain-language input)
          minLength: 1
        what:
          type: string
          description: What happened (inventory plain-language input)
          minLength: 1
        when:
          type: string
          description: When it happened within the game context (inventory plain-language input)
          minLength: 1
      additionalProperties: false

    HockeyEventResponse:
      type: object
      description: >
        Created game-event resource returned on 201 — server id plus accepted fields
        (docs/api/error-and-status-model.md success body).
      required:
        - eventId
        - providerEventId
        - period
        - who
        - what
        - when
      properties:
        eventId:
          type: string
          description: Server-assigned id for the stored event
          minLength: 1
        providerEventId:
          type: string
          minLength: 1
        period:
          type: string
          minLength: 1
        who:
          type: string
          minLength: 1
        what:
          type: string
          minLength: 1
        when:
          type: string
          minLength: 1
      additionalProperties: false

    ErrorDetail:
      type: object
      description: One field-level problem inside ErrorResponse.error.details
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          description: >
            Dot path into the request body, or empty string when not field-specific
        code:
          type: string
          description: Machine-readable detail code (for example REQUIRED, DUPLICATE, OUT_OF_RANGE)
        message:
          type: string
          description: What the integrator should change
      additionalProperties: false

    ErrorBody:
      type: object
      description: Inner error object from the shared status-model envelope
      required:
        - code
        - message
        - details
      properties:
        code:
          type: string
          description: >
            Stable SCREAMING_SNAKE_CASE token — MALFORMED_REQUEST, UNAUTHENTICATED,
            FORBIDDEN, CONFLICT, or VALIDATION_FAILED for this operation's errors
          enum:
            - MALFORMED_REQUEST
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - VALIDATION_FAILED
        message:
          type: string
          description: Short human summary of the whole failure (never the only info on 422)
        details:
          type: array
          description: >
            Always an array. Empty for 401/403 when no field applies.
            One or more entries for every 422, and for 409 when a field caused the collision.
          items:
            $ref: "#/components/schemas/ErrorDetail"
      additionalProperties: false

    ErrorResponse:
      type: object
      description: >
        Shared structured error envelope from docs/api/error-and-status-model.md.
        Used for every non-success response on event and evaluation paths.
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
      additionalProperties: false

    EvaluationForm:
      type: object
      description: >
        Request body for POST /evaluation-forms (coach handoff).
        Required fields from the resource design / inventory: player,
        practice context, and judgment/notes.
      additionalProperties: false
      required:
        - player
        - practiceContext
        - notes
      properties:
        player:
          type: string
          description: Which player the evaluation is about
          minLength: 1
        practiceContext:
          type: string
          description: Practice context tying the judgment to that session
          minLength: 1
        notes:
          type: string
          description: Coach judgment and notes for the player
          minLength: 1

    EvaluationFormResponse:
      type: object
      description: >
        Stored evaluation returned on 201 — server id plus accepted fields
        (docs/api/error-and-status-model.md success body).
      additionalProperties: false
      required:
        - evaluationId
        - player
        - practiceContext
        - notes
      properties:
        evaluationId:
          type: string
          description: Server-assigned id for the stored evaluation
          minLength: 1
        player:
          type: string
          minLength: 1
        practiceContext:
          type: string
          minLength: 1
        notes:
          type: string
          minLength: 1