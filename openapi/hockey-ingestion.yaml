description: >
  Third-party hockey data provider pushes one game event.
  The request body includes providerEventId, the idempotency key for that
  happening (same key on a timeout retry as on the first send).
  On a first accept, success stores a new event and returns 201 with the
  created resource.
  On an exact replay of an already-accepted providerEventId, return that
  same original success (201 and the same success body shape) and do not
  create a second stored event — one goal is counted once.
  Do not treat that exact replay as an error merely because the key was
  already accepted.
  Failures never return 200 with a success flag set to false.

"201":
  description: >
    Event accepted — returned for a first create and again for an exact
    replay of an already-accepted providerEventId (same success body;
    no second stored event).

"409":
  description: >
    Conflict — a unique collision that is not a quiet exact replay of an
    already-accepted providerEventId (exact replays use 201 above).

providerEventId:
  type: string
  description: >
    Idempotency key from the provider for this happening. Stays the same
    on a timeout retry. An exact replay of an already-accepted key returns
    the original 201 success and must not create a second stored event.
  minLength: 1